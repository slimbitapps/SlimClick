<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<style>html, body { width: 1080px; height: 1920px; }</style>
</head>
<body>
<div id="stage"></div>
<script src="../motion/core.js"></script>
<script src="../motion/slimclick.js"></script>
<script>
// Short 3 – Schul-WLAN trennt Geräte → Handy-Hotspot → neu scannen → läuft (ohne Datenvolumen).
const NODES = { phone: [270, 1050], laptop: [810, 1050], router: [540, 620] };

/** Netzwerk-Bild: Router, Handy, Laptop + Linien dazwischen */
function net(r) {
  const o = {};
  o.svg = el('div', 'abs', r);
  css(o.svg, { inset: 0 });
  o.svg.innerHTML = `<svg width="1080" height="1920" style="position:absolute;inset:0">
    <line id="l-pr" stroke-width="10" stroke-linecap="round"/><line id="l-lr" stroke-width="10" stroke-linecap="round"/>
    <line id="l-pl" stroke-width="12" stroke-linecap="round"/>
    <circle id="ring1" fill="none" stroke-width="6"/><circle id="ring2" fill="none" stroke-width="6"/><circle id="ring3" fill="none" stroke-width="6"/></svg>`;
  const $ = (id) => o.svg.querySelector('#' + id);
  o.l = { pr: $('l-pr'), lr: $('l-lr'), pl: $('l-pl') };
  o.rings = [$('ring1'), $('ring2'), $('ring3')];
  const node = (key, ic, label) => {
    const n = el('div', 'node', r, `<div class="ic">${ic}</div><div class="lb">${label}</div>`);
    css(n, { left: NODES[key][0] - 140 + 'px', top: NODES[key][1] - 100 + 'px', width: '280px' });
    return n;
  };
  o.router = node('router', '📡', 'School Wi-Fi');
  o.phone = node('phone', '📱', 'Your phone');
  o.laptop = node('laptop', '💻', 'Your laptop');
  o.wall = el('div', 'abs', r, '🧱');
  css(o.wall, { left: '480px', top: '985px', fontSize: '120px' });
  o.x = el('div', 'abs', r, '✕');
  css(o.x, { left: '492px', top: '960px', fontSize: '150px', fontWeight: 900, color: '#ff4d6d', lineHeight: 1 });
  o.line = (ln, a, b, k, color, dash = '') => {
    const [x1, y1] = NODES[a], [x2, y2] = NODES[b];
    ln.setAttribute('x1', x1); ln.setAttribute('y1', y1 - 10);
    ln.setAttribute('x2', lerp(x1, x2, k)); ln.setAttribute('y2', lerp(y1, y2, k) - 10);
    ln.setAttribute('stroke', color);
    ln.setAttribute('stroke-dasharray', dash);
  };
  return o;
}

// ---------- 1: Hook
scene('hook', (r, s) => {
  s.t1 = headline(r, 'Phone won’t connect', 120, 96);
  s.t2 = headline(r, 'at school?', 230, 96);
  s.n = net(r);
  s.n.router.style.display = 'none';
  s.n.wall.style.display = 'none';
  s.fault = el('div', 'chip', r, 'It’s the Wi-Fi, not you');
  css(s.fault, { left: '50%', top: '1350px', fontSize: '44px' });
}, (s, lt, D) => {
  drawWords(s.t1, lt, 0.05, 0.08);
  drawWords(s.t2, lt, 0.4, 0.08);
  ['phone', 'laptop'].forEach((k, i) => {
    const kk = E.back(p(lt, 0.1 + i * 0.15, 0.5));
    s.n[k].style.transform = `scale(${kk})`;
  });
  // Verbindungsversuch: Linie wächst, bricht ab
  const tries = (lt * 1.1) % 1;
  s.n.line(s.n.l.pl, 'phone', 'laptop', lt < D * 0.55 ? Math.min(0.48, tries) : 0.48, '#ff4d6d', '22 18');
  s.n.l.pl.style.opacity = 1;
  const kx = E.back(p(lt, 0.6, 0.35));
  s.n.x.style.opacity = p(lt, 0.6, 0.1);
  s.n.x.style.transform = `scale(${0.5 + 0.5 * kx})`;
  ['pr', 'lr'].forEach((k) => (s.n.l[k].style.opacity = 0));
  s.n.rings.forEach((c) => (c.style.opacity = 0));
  const kf = E.back(p(lt, D * 0.55, 0.45));
  s.fault.style.opacity = p(lt, D * 0.55, 0.2);
  s.fault.style.transform = `translateX(-50%) scale(${0.6 + 0.4 * kf})`;
});
scenes[scenes.length - 1].sfx = (D) => [{ t: 0.6, type: 'pop' }, { t: D * 0.55, type: 'pop' }];

// ---------- 2: Warum – das Netz trennt die Geräte
scene('why', (r, s) => {
  s.t = headline(r, 'Devices are kept apart', 120, 88);
  s.n = net(r);
}, (s, lt, D) => {
  drawWords(s.t, lt, 0.05, 0.08);
  const kr = E.back(p(lt, 0.1, 0.5));
  s.n.router.style.transform = `scale(${kr})`;
  s.n.line(s.n.l.pr, 'phone', 'router', E.out(p(lt, 0.4, 0.5)), 'rgba(255,255,255,.35)');
  s.n.line(s.n.l.lr, 'laptop', 'router', E.out(p(lt, 0.6, 0.5)), 'rgba(255,255,255,.35)');
  s.n.line(s.n.l.pl, 'phone', 'laptop', 1, '#ff4d6d', '22 18');
  s.n.l.pl.style.opacity = 0.7;
  const kw = E.back(p(lt, D * 0.45, 0.5));
  s.n.wall.style.transform = `translateY(${(1 - kw) * -200}px)`;
  s.n.wall.style.opacity = p(lt, D * 0.45, 0.2);
  s.n.x.style.opacity = p(lt, D * 0.6, 0.15);
  s.n.x.style.transform = 'translate(-6px,-110px) scale(.7)';
  s.n.rings.forEach((c) => (c.style.opacity = 0));
});
scenes[scenes.length - 1].sfx = (D) => [{ t: 0.1, type: 'pop' }, { t: D * 0.45, type: 'whoosh' }, { t: D * 0.6, type: 'pop' }];

// ---------- 3: Die Lösung – Handy-Hotspot
scene('fix', (r, s) => {
  s.t = headline(r, 'The 10-second fix', 120, 96);
  s.t.querySelectorAll('.word').forEach((w, i) => i === 1 && w.classList.add('grad'));
  s.n = net(r);
  s.chip = el('div', 'chip', r, '📶 Hotspot ON');
  css(s.chip, { left: '50%', top: '1350px', fontSize: '44px', color: '#7ef0a8' });
  s.ok = el('div', 'abs', r, '✓');
  css(s.ok, { left: '505px', top: '945px', fontSize: '110px', fontWeight: 900, color: '#33c37a' });
}, (s, lt, D) => {
  drawWords(s.t, lt, 0.05, 0.1);
  const out = p(lt, 0.2, 0.5);
  s.n.router.style.opacity = 1 - out;
  s.n.line(s.n.l.pr, 'phone', 'router', 1, 'rgba(255,255,255,.35)');
  s.n.line(s.n.l.lr, 'laptop', 'router', 1, 'rgba(255,255,255,.35)');
  s.n.l.pr.style.opacity = s.n.l.lr.style.opacity = 1 - out;
  s.n.wall.style.opacity = s.n.x.style.opacity = 1 - out;
  // Hotspot-Ringe am Handy
  const hs = lt >= D * 0.3;
  s.n.rings.forEach((c, i) => {
    const q = ((lt - D * 0.3) * 0.8 + i / 3) % 1;
    c.setAttribute('cx', NODES.phone[0]); c.setAttribute('cy', NODES.phone[1] - 10);
    c.setAttribute('r', 90 + q * 260);
    c.setAttribute('stroke', '#33c37a');
    c.style.opacity = hs ? (1 - q) * 0.7 : 0;
  });
  const kc = E.back(p(lt, D * 0.32, 0.4));
  s.chip.style.opacity = p(lt, D * 0.32, 0.2);
  s.chip.style.transform = `translateX(-50%) scale(${0.6 + 0.4 * kc})`;
  // Laptop verbindet sich mit dem Handy
  s.n.line(s.n.l.pl, 'laptop', 'phone', E.io(p(lt, D * 0.62, 0.5)), '#33c37a');
  s.n.l.pl.style.opacity = lt >= D * 0.62 ? 1 : 0;
  const ko = E.back(p(lt, D * 0.62 + 0.5, 0.4));
  s.ok.style.opacity = p(lt, D * 0.62 + 0.5, 0.15);
  s.ok.style.transform = `scale(${0.4 + 0.6 * ko})`;
});
scenes[scenes.length - 1].sfx = (D) => [{ t: D * 0.32, type: 'pop' }, { t: D * 0.62, type: 'whoosh' }, { t: D * 0.62 + 0.5, type: 'pop' }];

// ---------- 4: QR passt sich an → neu scannen → steuern
scene('rescan', (r, s) => {
  s.t = headline(r, 'Scan again. Done.', 120, 96);
  s.lap = laptop(r, 860, 540, 600);
  s.lap.useShot('10-home-qr');
  s.badge = el('div', 'chip', r, '📶 Hotspot');
  css(s.badge, { left: '770px', top: '300px', fontSize: '32px', color: '#7ef0a8' });
  s.ph = phone(r, { x: 370, y: 950, w: 340 });
  s.ph.alt.style.display = 'block';
  s.cam = cameraView(s.ph);
  s.ph.deck.show(0);
  s.data = el('div', 'chip', r, '0 MB mobile data');
  css(s.data, { left: '50%', top: '1640px', fontSize: '40px' });
}, (s, lt, D) => {
  drawWords(s.t, lt, 0.05, 0.1);
  place(s.lap, { s: 1 });
  // QR-Code „aktualisiert sich“: kurzes Aufblitzen
  s.lap.shot.style.filter = `brightness(${1 + 0.8 * Math.max(0, 1 - Math.abs(lt - 0.5) * 5)})`;
  s.badge.style.opacity = p(lt, 0.4, 0.3);
  const kp = E.out(p(lt, 0.3, 0.6));
  s.ph.place(370, 950 + (1 - kp) * 400, 1);
  const found = p(lt, D * 0.25, 0.25);
  s.cam.box.style.opacity = found;
  s.cam.banner.style.opacity = p(lt, D * 0.35, 0.2);
  tapAt(s.ph, 195, 108, lt - D * 0.45);
  const sw = p(lt, D * 0.5, 0.3);
  s.ph.alt.style.opacity = 1 - sw;
  s.ph.alt.style.display = sw < 1 ? 'block' : 'none';
  const tNext = D * 0.62;
  tapAt(s.ph, 242, 590, sw >= 1 ? lt - tNext : -9);
  pressBtn(s.ph.next, lt - tNext);
  showTimeline(s.lap.deck, lt, [{ t: tNext + 0.08, idx: 1 }]);
  showTimeline(s.ph.deck, lt, [{ t: tNext + 0.08, idx: 1 }]);
  s.lap.shot.style.display = lt >= tNext ? 'none' : 'block';
  const kd = E.back(p(lt, D * 0.75, 0.4));
  s.data.style.opacity = p(lt, D * 0.75, 0.2);
  s.data.style.transform = `translateX(-50%) scale(${0.6 + 0.4 * kd})`;
});
scenes[scenes.length - 1].sfx = (D) => [{ t: D * 0.25, type: 'pop' }, { t: D * 0.45, type: 'click' }, { t: D * 0.62 - 0.03, type: 'click' }, { t: D * 0.62 + 0.08, type: 'whoosh' }, { t: D * 0.75, type: 'pop' }];

// ---------- 5: echte App + Link
scene('cta', (r, s) => ctaScene(r, s, { vertical: true }), (s, lt) => ctaDraw(s, lt));

start({ captionTop: 1700, captionSize: 64 });
</script>
</body>
</html>
