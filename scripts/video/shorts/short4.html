<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<style>
  html, body { width: 1080px; height: 1920px; }
  .tsheet { position: absolute; inset: 0; background: #1b1c21; color: #fff; font-family: Inter, -apple-system, sans-serif; }
  .tsheet .tt { position: absolute; left: 22px; top: 70px; font-size: 22px; font-weight: 800; }
  .tsheet .big { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 76px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
  .tsheet .chips { position: absolute; left: 24px; right: 24px; top: 300px; display: flex; gap: 10px; justify-content: center; }
  .tsheet .chips div { padding: 12px 18px; border-radius: 999px; background: #2a2b31; font-size: 20px; font-weight: 700; color: #a6aab3; }
  .tsheet .chips div.on { background: rgba(255,77,109,.18); color: #ff6b88; box-shadow: inset 0 0 0 2px #ff4d6d; }
  .tsheet .go { position: absolute; left: 24px; right: 24px; top: 420px; height: 70px; border-radius: 18px; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
  .face { position: absolute; font-size: 120px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../motion/core.js"></script>
<script src="../motion/slimclick.js"></script>
<script>
// Short 4 – Timer: auf dem Handy, blinkt vor dem Ende unauffällig gelb, am Ende rot.
// Zeiten = gesprochene Wörter (aus words.py, Sekunden ab Szenenbeginn)
const PH = { x: 345, y: 520, w: 390 };
const fmt = (s) => { const n = Math.max(0, Math.ceil(s)); return `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`; };

// ---------- 1: Hook – die Zeit läuft ab
scene('hook', (r, s) => {
  s.t1 = headline(r, 'Out of time?', 150, 130);
  s.big = el('div', 'abs head', r, '00:10');
  css(s.big, { top: '640px', fontSize: '300px', letterSpacing: '-10px', fontVariantNumeric: 'tabular-nums' });
  s.sub = el('div', 'chip', r, '😬 mid-presentation');
  css(s.sub, { left: '50%', top: '1080px', fontSize: '46px' });
}, (s, lt, D) => {
  drawWords(s.t1, lt, 0.05, 0.12);
  const left = Math.max(0, 10 - lt * 3.4); // läuft bis „worst“ (3.05) ab
  s.big.textContent = fmt(left);
  const hot = left <= 0.01;
  s.big.style.color = hot ? '#ff4d6d' : left < 4 ? '#f6b03c' : '#fff';
  s.big.style.transform = hot ? shake(lt * 9, 6) : 'none';
  const k = E.back(p(lt, 1.9, 0.4)); // „presentation“
  s.sub.style.opacity = p(lt, 1.9, 0.2);
  s.sub.style.transform = `translateX(-50%) scale(${0.6 + 0.4 * k})`;
});
scenes[scenes.length - 1].sfx = () => [{ t: 1.9, type: 'pop' }, { t: 3.05, type: 'whoosh' }];

// ---------- 2: Timer am Handy einstellen und starten
scene('set', (r, s) => {
  s.t = headline(r, 'A timer on your phone', 150, 96);
  s.ph = phone(r, PH);
  s.ph.alt.style.display = 'block';
  s.ph.alt.innerHTML = `<div class="tsheet"><div class="tt">Timer</div><div class="big">10:00</div>
    <div class="chips"><div>5</div><div>10</div><div>15</div><div>20</div></div><div class="go">Start</div></div>`;
  s.big = s.ph.alt.querySelector('.big');
  s.chips = [...s.ph.alt.querySelectorAll('.chips div')];
  s.go = s.ph.alt.querySelector('.go');
}, (s, lt, D) => {
  drawWords(s.t, lt, 0.05, 0.1);
  const k = E.back(p(lt, 0, 0.6));
  s.ph.place(PH.x, PH.y + (1 - k) * 700, 1);
  // „ten“ 2.5 · „fifteen“ 3.06 · „twenty“ 3.74 → dann 15 gewählt (4.0) · „tap start“ 4.77
  const pick = lt < 2.45 ? 1 : lt < 3.0 ? 1 : lt < 3.7 ? 2 : lt < 4.0 ? 3 : 2;
  const taps = [2.45, 3.0, 3.7, 4.0];
  s.chips.forEach((c, i) => c.classList.toggle('on', i === pick));
  const lastTap = [...taps].reverse().find((t) => lt >= t - 0.1);
  const chipX = (i) => 60 + i * 84;
  if (lt < 4.6) tapAt(s.ph, chipX(lt < 3.0 ? 1 : lt < 3.7 ? 2 : lt < 4.0 ? 3 : 2), 320, lastTap !== undefined ? lt - lastTap : -9);
  else tapAt(s.ph, 195, 455, lt - 4.75);
  const started = lt >= 4.8;
  const mins = [5, 10, 15, 20][pick];
  s.big.textContent = started ? fmt(mins * 60 - (lt - 4.8)) : fmt(mins * 60);
  s.go.style.background = started ? '#2a2b31' : GRAD;
  s.go.textContent = started ? 'Pause' : 'Start';
  pressBtn(s.go, lt - 4.75);
});
scenes[scenes.length - 1].sfx = () => [2.45, 3.0, 3.7, 4.0].map((t) => ({ t, type: 'click' })).concat([{ t: 4.72, type: 'click' }, { t: 4.8, type: 'pop' }]);

// ---------- 3: Kurz vor dem Ende blinkt es gelb – nur du merkst es
scene('warn', (r, s) => {
  s.t = headline(r, 'Only you notice', 150, 104);
  s.t.querySelectorAll('.word').forEach((w, i) => i === 1 && w.classList.add('grad'));
  s.ph = phone(r, PH);
  s.ph.deck.show(3);
  s.faces = ['😐', '🙂', '😐', '🙂', '😐'].map((f, i) => {
    const e = el('div', 'face', r, f);
    css(e, { left: 60 + i * 200 + 'px', top: '330px' });
    return e;
  });
  s.c1 = el('div', 'chip', r, '🤫 Nobody notices');
  css(s.c1, { left: '50%', top: '1450px' });
  s.c2 = el('div', 'chip', r, '✓ Time to wrap up');
  css(s.c2, { left: '50%', top: '1570px', color: '#f6d07c' });
}, (s, lt, D) => {
  drawWords(s.t, lt, 0.05, 0.1);
  // Countdown so, dass die 5:00-Marke genau bei „flashes“ (3.37) erreicht wird
  const flashAt = 3.37;
  const remain = 300 + (flashAt - lt) * 1.5;
  s.ph.timer.textContent = fmt(remain);
  const f = lt >= flashAt ? Math.max(0, Math.sin(((lt - flashAt) / 1.3) * Math.PI * 3)) * (1 - p(lt, flashAt + 1.2, 0.2)) : 0;
  s.ph.flash.style.background = '#f6b03c';
  s.ph.flash.style.opacity = f * 0.65;
  s.ph.timer.style.color = lt >= flashAt ? '#f6b03c' : '#fff';
  s.faces.forEach((e, i) => (e.style.transform = `translateY(${Math.sin(lt * 2 + i) * 6}px)`));
  [[s.c1, 4.67], [s.c2, 6.85]].forEach(([c, at]) => { // „nobody“, „wrap up“
    const k = E.back(p(lt, at, 0.4));
    c.style.opacity = p(lt, at, 0.2);
    c.style.transform = `translateX(-50%) scale(${0.6 + 0.4 * k})`;
  });
});
scenes[scenes.length - 1].sfx = () => [{ t: 3.37, type: 'pop' }, { t: 4.67, type: 'pop' }, { t: 6.85, type: 'pop' }];

// ---------- 4: Zeit um → rot
scene('end', (r, s) => {
  s.t = headline(r, 'Time’s up = red', 150, 104);
  s.ph = phone(r, PH);
  s.ph.deck.show(4);
  s.c = el('div', 'chip', r, '🚫 Never run over again');
  css(s.c, { left: '50%', top: '1450px' });
}, (s, lt, D) => {
  drawWords(s.t, lt, 0.05, 0.1);
  const redAt = 1.6; // „flashes red“
  const remain = (redAt - lt) * 1.0 + 0.5;
  s.ph.timer.textContent = remain > 0 ? fmt(remain) : '+' + fmt(-remain);
  const red = lt >= redAt;
  s.ph.timer.style.color = red ? '#fff' : '#f6b03c';
  s.ph.timer.style.background = red ? '#ff5c63' : '#1b1c21';
  const f = red ? Math.max(0, Math.sin(((lt - redAt) / 1.3) * Math.PI * 3)) * (1 - p(lt, redAt + 1.2, 0.2)) : 0;
  s.ph.flash.style.background = '#ff5c63';
  s.ph.flash.style.opacity = f * 0.65;
  const k = E.back(p(lt, 2.8, 0.4)); // „so you never“
  s.c.style.opacity = p(lt, 2.8, 0.2);
  s.c.style.transform = `translateX(-50%) scale(${0.6 + 0.4 * k})`;
});
scenes[scenes.length - 1].sfx = () => [{ t: 1.6, type: 'pop' }, { t: 2.8, type: 'pop' }];

// ---------- 5: echte App + Link
scene('cta', (r, s) => ctaScene(r, s, { vertical: true }), (s, lt) => ctaDraw(s, lt));

start({ captionTop: 1700, captionSize: 64 });
</script>
</body>
</html>
