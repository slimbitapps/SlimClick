<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<style>
  html, body { width: 1080px; height: 1920px; }
  .kp { position: absolute; inset: 0; background: #1b1c21; font-family: Inter, -apple-system, sans-serif; color: #fff; }
  .kp .tt { position: absolute; left: 22px; top: 70px; font-size: 22px; font-weight: 800; }
  .kp .num { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font-size: 70px; font-weight: 800; }
  .kp .grid { position: absolute; left: 20px; right: 20px; top: 260px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kp .grid div { height: 70px; border-radius: 16px; background: #2a2b31; display: grid; place-items: center; font-size: 30px; font-weight: 700; }
  .kp .grid div.go { background: linear-gradient(135deg,#ff7a59,#ff3d77); font-size: 24px; }
  .face { position: absolute; font-size: 110px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../motion/core.js"></script>
<script src="../motion/slimclick.js"></script>
<script>
// Short 6 – Live-Vorschau: zum Publikum schauen und trotzdem wissen, wo man ist. Dann „Gehe zu“.
// Zeiten = gesprochene Wörter (aus words.py, Sekunden ab Szenenbeginn)
const WALL = { x: 90, y: 330, w: 900 };
const pop = (e, lt, at, base = 'translateX(-50%) ') => { const k = E.back(p(lt, at, 0.4)); e.style.opacity = p(lt, at, 0.2); e.style.transform = `${base}scale(${0.6 + 0.4 * k})`; };

// ---------- 1: Hook – Rücken zur Klasse
scene('hook', (r, s) => {
  s.t1 = headline(r, 'Stop turning your back', 130, 92);
  s.wall = screenWall(r, WALL);
  s.wall.deck.show(1);
  s.me = el('div', 'abs', r, '🧍');
  css(s.me, { left: '440px', top: '900px', fontSize: '300px', filter: 'brightness(.25) drop-shadow(0 0 30px rgba(255,255,255,.15))' });
  s.class = ['🧑‍🎓', '👩‍🎓', '🧑‍🎓', '👨‍🎓', '👩‍🎓'].map((f, i) => { const e = el('div', 'face', r, f); css(e, { left: 40 + i * 205 + 'px', top: '1360px' }); return e; });
  s.x = el('div', 'abs', r, '✕');
  css(s.x, { left: '440px', top: '880px', fontSize: '320px', fontWeight: 900, color: '#ff4d6d', lineHeight: 1 });
}, (s, lt, D) => {
  drawWords(s.t1, lt, 0.05, 0.1);
  s.me.style.transform = `rotate(${Math.sin(lt * 3) * 3}deg)`;
  s.class.forEach((e, i) => (e.style.transform = `translateY(${Math.sin(lt * 2 + i) * 6}px)`));
  const kx = E.back(p(lt, 1.9, 0.35)); // „check your slides“
  s.x.style.opacity = p(lt, 1.9, 0.1);
  s.x.style.transform = `scale(${0.4 + 0.6 * kx})`;
});
scenes[scenes.length - 1].sfx = () => [{ t: 1.9, type: 'pop' }];

// ---------- 2: Live-Vorschau am Handy
scene('preview', (r, s) => {
  s.t = headline(r, 'Live preview', 130, 120);
  s.t.querySelectorAll('.word').forEach((w) => w.classList.add('grad'));
  s.ph = phone(r, { x: 300, y: 380, w: 480 });
  s.ph.deck.show(1);
  s.c = el('div', 'chip', r, '👀 the slide everyone sees');
  css(s.c, { left: '50%', top: '1430px', fontSize: '40px' });
}, (s, lt, D) => {
  drawWords(s.t, lt, 1.3, 0.12); // „live preview“
  const k = E.back(p(lt, 0, 0.6));
  s.ph.place(300, 380 + (1 - k) * 700, 1);
  s.ph.ring.style.opacity = p(lt, 1.35, 0.3) * (0.6 + 0.4 * Math.sin(lt * 6));
  pop(s.c, lt, 2.6); // „current slide“
});
scenes[scenes.length - 1].sfx = () => [{ t: 1.35, type: 'pop' }, { t: 2.6, type: 'pop' }];

// ---------- 3: Zum Publikum schauen und trotzdem wissen, wo du bist
scene('face', (r, s) => {
  s.class = ['🧑‍🎓', '👩‍🎓', '🧑‍🎓', '👨‍🎓', '👩‍🎓'].map((f, i) => { const e = el('div', 'face', r, f); css(e, { left: 40 + i * 205 + 'px', top: '200px' }); return e; });
  s.eye = el('div', 'chip', r, '👀 Eye contact');
  css(s.eye, { left: '50%', top: '400px' });
  s.ph = phone(r, { x: 345, y: 560, w: 390 });
  s.ph.deck.show(1);
  s.where = el('div', 'chip', r, '📍 Slide 2 of 5');
  css(s.where, { left: '50%', top: '1450px', color: '#ffd3dc' });
}, (s, lt, D) => {
  s.class.forEach((e, i) => { const k = E.back(p(lt, 0.2 + i * 0.08, 0.4)); e.style.transform = `scale(${k}) translateY(${Math.sin(lt * 2 + i) * 5}px)`; });
  pop(s.eye, lt, 0.6); // „look at your audience“
  s.ph.ring.style.opacity = 0.5 + 0.5 * Math.sin(lt * 5);
  pop(s.where, lt, 2.5); // „exactly where you are“
});
scenes[scenes.length - 1].sfx = () => [{ t: 0.6, type: 'pop' }, { t: 2.5, type: 'pop' }];

// ---------- 4: „Gehe zu“ – direkt zu Folie 3
scene('goto', (r, s) => {
  s.t = headline(r, 'Jump to any slide', 120, 96);
  s.wall = screenWall(r, { x: 140, y: 300, w: 800 });
  s.ph = phone(r, { x: 370, y: 820, w: 340 });
  s.ph.deck.show(1);
  s.ph.alt.innerHTML = `<div class="kp"><div class="tt">Jump to slide</div><div class="num">–</div><div class="grid">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'Go'].map((n) => `<div class="${n === 'Go' ? 'go' : ''}">${n}</div>`).join('')}</div></div>`;
  s.num = s.ph.alt.querySelector('.num');
  s.keys = [...s.ph.alt.querySelectorAll('.grid div')];
}, (s, lt, D) => {
  drawWords(s.t, lt, 0.05, 0.1);
  // „go to“ 3.28 → Werkzeug antippen · „three“ 4.16 → 3 · danach „Go“ → Folie 3 auf Beamer und Handy
  const tGoto = 3.25, tThree = 4.15, tGo = 4.7;
  const jump = [{ t: tGo + 0.1, idx: 3 }]; // Folie „3 · Precipitation“
  showTimeline(s.wall.deck, lt, jump, 1);
  showTimeline(s.ph.deck, lt, jump, 1);
  const open = lt >= tGoto + 0.15 && lt < tGo + 0.25;
  s.ph.alt.style.display = open ? 'block' : 'none';
  s.num.textContent = lt >= tThree ? '3' : '–';
  s.keys.forEach((k, i) => (k.style.background = i === 2 && Math.abs(lt - tThree) < 0.2 ? '#ff4d6d' : i === 11 ? '' : '#2a2b31'));
  if (lt < tGoto + 0.2) { const [x, y] = [14 + 87 * 3 + 39, 367]; tapAt(s.ph, x, y, lt - tGoto); }
  else if (lt < tGo - 0.1) tapAt(s.ph, 20 + 2 * 120 + 50, 260 + 35, lt - tThree);
  else tapAt(s.ph, 20 + 2 * 120 + 50, 260 + 3 * 80 + 35, lt - tGo);
  // Folie 1–2 laufen vorher zur Einstimmung (1.0 „back“, 1.5 „three“ im Satz: noch nichts tun)
});
scenes[scenes.length - 1].sfx = () => [{ t: 3.22, type: 'click' }, { t: 4.12, type: 'click' }, { t: 4.67, type: 'click' }, { t: 4.8, type: 'whoosh' }];

// ---------- 5: echte App + Link
scene('cta', (r, s) => ctaScene(r, s, { vertical: true }), (s, lt) => ctaDraw(s, lt));

start({ captionTop: 1700, captionSize: 64 });
</script>
</body>
</html>
